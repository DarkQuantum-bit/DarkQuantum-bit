name: Cyan contribution animation

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate cyan animated contribution grids
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: DarkQuantum-bit
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00F0FF&color_dots=#0D1117,#0C4652,#0A7989,#15BCCA,#67EAF0
            dist/github-snake-light.svg?palette=github-light&color_snake=#00AFC4&color_dots=#F5FBFD,#D4F5F8,#9DE9EE,#4EC8D5,#0E91A4

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
