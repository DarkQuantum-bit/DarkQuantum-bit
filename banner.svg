<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="325" viewBox="0 0 1200 325" role="img" aria-label="Carlos Gabriel Ribeiro | Applied Mathematics, Machine Learning and AI Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06111B"/>
      <stop offset="0.55" stop-color="#082331"/>
      <stop offset="1" stop-color="#0A3442"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#18F2F5"/>
      <stop offset="1" stop-color="#39A9FF"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#15E8F1" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#39A9FF" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1B6774" stroke-opacity="0.20" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo1">
      <stop stop-color="#00EAF0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#00EAF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2">
      <stop stop-color="#3AB0FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3AB0FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="325" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="325" rx="24" fill="url(#grid)"/>

  <circle cx="970" cy="155" r="190" fill="url(#halo1)"/>
  <circle cx="1040" cy="180" r="120" fill="url(#halo2)"/>

  <!-- Decorative neural network -->
  <g stroke="url(#link)" stroke-width="2.2" fill="none" opacity="0.9">
    <!-- input to hidden 1 -->
    <path d="M770 76 L860 60"/>
    <path d="M770 76 L860 118"/>
    <path d="M770 76 L860 180"/>
    <path d="M770 76 L860 246"/>

    <path d="M770 127 L860 60"/>
    <path d="M770 127 L860 118"/>
    <path d="M770 127 L860 180"/>
    <path d="M770 127 L860 246"/>

    <path d="M770 178 L860 60"/>
    <path d="M770 178 L860 118"/>
    <path d="M770 178 L860 180"/>
    <path d="M770 178 L860 246"/>

    <path d="M770 229 L860 60"/>
    <path d="M770 229 L860 118"/>
    <path d="M770 229 L860 180"/>
    <path d="M770 229 L860 246"/>

    <!-- hidden 1 to hidden 2 -->
    <path d="M860 60 L955 88"/>
    <path d="M860 60 L955 154"/>
    <path d="M860 60 L955 222"/>

    <path d="M860 118 L955 88"/>
    <path d="M860 118 L955 154"/>
    <path d="M860 118 L955 222"/>

    <path d="M860 180 L955 88"/>
    <path d="M860 180 L955 154"/>
    <path d="M860 180 L955 222"/>

    <path d="M860 246 L955 88"/>
    <path d="M860 246 L955 154"/>
    <path d="M860 246 L955 222"/>

    <!-- hidden 2 to output -->
    <path d="M955 88 L1062 118"/>
    <path d="M955 88 L1062 196"/>
    <path d="M955 154 L1062 118"/>
    <path d="M955 154 L1062 196"/>
    <path d="M955 222 L1062 118"/>
    <path d="M955 222 L1062 196"/>
  </g>

  <g filter="url(#glow)">
    <!-- input layer -->
    <g fill="#A7FBFF" stroke="#18F2F5" stroke-width="2">
      <circle cx="770" cy="76" r="10"/>
      <circle cx="770" cy="127" r="10"/>
      <circle cx="770" cy="178" r="10"/>
      <circle cx="770" cy="229" r="10"/>
    </g>

    <!-- hidden layer 1 -->
    <g fill="#76F5FB" stroke="#18F2F5" stroke-width="2.2">
      <circle cx="860" cy="60" r="12"/>
      <circle cx="860" cy="118" r="12"/>
      <circle cx="860" cy="180" r="12"/>
      <circle cx="860" cy="246" r="12"/>
    </g>

    <!-- hidden layer 2 -->
    <g fill="#4DE9F8" stroke="#1FE6F2" stroke-width="2.4">
      <circle cx="955" cy="88" r="14"/>
      <circle cx="955" cy="154" r="14"/>
      <circle cx="955" cy="222" r="14"/>
    </g>

    <!-- output layer -->
    <g fill="#D7FCFF" stroke="#39A9FF" stroke-width="2.5">
      <circle cx="1062" cy="118" r="16"/>
      <circle cx="1062" cy="196" r="16"/>
    </g>
  </g>

  <!-- subtle data pulse lines -->
  <g opacity="0.55" stroke="url(#cyan)" stroke-width="1.6" fill="none">
    <path d="M735 275 C790 265, 835 285, 895 270 S1005 250, 1085 276"/>
    <path d="M745 288 C805 278, 850 298, 910 283 S1015 264, 1100 292" opacity="0.45"/>
  </g>

  <!-- left content -->
  <rect x="62" y="55" width="4" height="211" rx="2" fill="url(#cyan)"/>
  <text x="92" y="96" fill="#38E7F0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">DARKQUANTUM  /  GITHUB PORTFOLIO</text>
  <text x="92" y="168" fill="#F3FEFF" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700">Carlos Gabriel Ribeiro</text>
  <text x="92" y="210" fill="#97EFF4" font-family="Arial, Helvetica, sans-serif" font-size="23">Applied Mathematics  ·  Machine Learning  ·  AI Engineering</text>
  <text x="92" y="260" fill="#B5CED6" font-family="Arial, Helvetica, sans-serif" font-size="17">Mathematical modeling  /  Optimization  /  Scientific computing</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" opacity="0.72">
    <text x="746" y="44" fill="#77F8FB">NEURAL NETWORK</text>
    <text x="752" y="295" fill="#77F8FB">LEARNING REPRESENTATIONS</text>
  </g>

  <path d="M0 313H1200" stroke="#18DDEB" stroke-width="4"/>
</svg>
